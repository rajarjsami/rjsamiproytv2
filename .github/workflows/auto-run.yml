name: MoneyPrinter AutoBot
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bypass Twitter Bug Automatically
        run: |
          echo 'class Twitter:' > src/classes/Twitter.py
          echo '    def __init__(self, *args, **kwargs): pass' >> src/classes/Twitter.py
          echo '    def post(self, *args, **kwargs): pass' >> src/classes/Twitter.py

      - name: Run Main Script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python src/main.py
